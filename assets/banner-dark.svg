<svg width="1200" height="320" viewBox="0 0 1200 320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <radialGradient id="glow" cx="80%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#1c2333" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="320" fill="#0b0f19"/>
  <rect width="1200" height="320" fill="url(#grid)"/>
  <rect width="1200" height="320" fill="url(#glow)"/>

  <!-- agent graph, right side -->
  <g stroke="url(#accent)" stroke-width="1.4" opacity="0.55">
    <line x1="760" y1="90" x2="900" y2="60"/>
    <line x1="760" y1="90" x2="880" y2="150"/>
    <line x1="880" y1="150" x2="1020" y2="110"/>
    <line x1="880" y1="150" x2="960" y2="240"/>
    <line x1="960" y1="240" x2="1100" y2="210"/>
    <line x1="1020" y1="110" x2="1130" y2="70"/>
    <line x1="760" y1="90" x2="820" y2="220"/>
    <line x1="820" y1="220" x2="960" y2="240"/>
  </g>
  <g fill="url(#accent)">
    <circle cx="760" cy="90" r="6"/>
    <circle cx="900" cy="60" r="4.5"/>
    <circle cx="880" cy="150" r="7"/>
    <circle cx="1020" cy="110" r="5"/>
    <circle cx="960" cy="240" r="6"/>
    <circle cx="1100" cy="210" r="4.5"/>
    <circle cx="1130" cy="70" r="4"/>
    <circle cx="820" cy="220" r="5"/>
  </g>

  <!-- name / title -->
  <text x="80" y="140" font-family="Helvetica Neue, Arial, sans-serif" font-size="54" font-weight="700" fill="#f4f6fb">Abhinav Pandey</text>
  <text x="80" y="182" font-family="Helvetica Neue, Arial, sans-serif" font-size="21" font-weight="400" fill="#9aa4b8">Full-Stack Software Engineer &#183; Agentic AI &amp; RAG Systems</text>

  <rect x="80" y="205" width="120" height="4" rx="2" fill="url(#accent)"/>

  <text x="80" y="250" font-family="Helvetica Neue, Arial, sans-serif" font-size="16" fill="#6b7488">IQVIA &#183; Bengaluru, India</text>
</svg>
